# NUCLEO-H723ZG satellite demo (Components/Satellite). Zephyr merges this after prj.conf.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_CAN=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_EEPROM=y
CONFIG_CRC=y
# The ground link is USART3 (ST-LINK VCP), not the MCU's USB port: no CDC ACM.
CONFIG_USB_DEVICE_STACK_NEXT=n
# ZephyrUartDriver (the ground link) receives via uart_irq_callback_user_data_set /
# uart_irq_rx_enable. The reference only gets this through CDC ACM's select, so
# without USB it must be set here, or no uplink byte is ever read.
CONFIG_UART_INTERRUPT_DRIVEN=y
